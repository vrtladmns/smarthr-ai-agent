services:
  recruiter-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: company-policy-recruiter-agent
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "8081:8081"
    volumes:
      - ./credentials:/app/credentials:ro
    command: ["python", "recruiter_agent.py", "--serve-graph-webhook"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

